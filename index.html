<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Razz娘・レースシミュレーター</title>

<style>
body {
  background:#0b0f1a;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
}

.container {
  max-width:500px;
  margin:auto;
}

.panel {
  background:#1a2233;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 0 10px #000;
}

h1 {
  color:#6cf;
}

.stat {
  text-align:left;
  margin:5px 0;
}

.bar {
  width:100%;
  height:12px;
  background:#333;
  border-radius:5px;
}

.fill {
  height:100%;
  background:linear-gradient(90deg,#4caf50,#8bc34a);
  border-radius:5px;
}

button {
  padding:10px 20px;
  background:#2a3a55;
  border:none;
  color:#fff;
  cursor:pointer;
  border-radius:5px;
}

button:hover {
  background:#3f5a88;
}
  
.log {
  height:200px;
  overflow:auto;
  text-align:left;
  background:#111;
  padding:10px;
  border-radius:5px;
}

.log-line {
  animation: fade 0.3s;
}

@keyframes fade {
  from {opacity:0;}
  to {opacity:1;}
}

.result {
  font-size:40px;
  color:gold;
  text-shadow:0 0 10px gold;
}

.prob-bar {
  height:10px;
  background:#444;
  margin:3px 0;
}

.prob-fill {
  height:100%;
  background:#6cf;
}
</style>
</head>

<body>

<div class="container">

<h1>Razz娘・レースシミュレーター</h1>

<div class="panel">
レース：
<select id="raceSelect"></select>

人数：
<span id="playersDisplay"></span>

やる気：
<select id="motivation">
  <option>絶不調</option>
  <option>不調</option>
  <option selected>普通</option>
  <option>好調</option>
  <option>絶好調</option>
</select>
</div>

<div class="panel">
<h3>ステータス</h3>

    <div id="rouletteBox">
  <div id="rouletteLabel">イベント抽選</div>
  <div id="rouletteDisplay">---</div>
</div>

<div class="stat">
  <label>スピード <span id="val_スピード"></span></label>
</div>

<div class="stat">
  <label>スタミナ <span id="val_スタミナ"></span></label>
</div>

<div class="stat">
  <label>パワー <span id="val_パワー"></span></label>
</div>

<div class="stat">
  <label>根性 <span id="val_根性"></span></label>
</div>

<div class="stat">
  <label>賢さ <span id="val_賢さ"></span></label>
</div>

</div>

</div>

<button id="raceBtn">入力完了</button>

<div id="rouletteBox">
  <div id="rouletteLabel">イベント抽選</div>
  <div id="rouletteDisplay">---</div>
</div>

  <div id="probBox" class="panel">
  <div class="prob-row">
    <span>🥇 1位</span>
    <div class="prob-bar"><div id="prob0" class="prob-fill"></div></div>
    <span id="prob0_text">25%</span>
  </div>

  <div class="prob-row">
    <span>🥈 上位30%</span>
    <div class="prob-bar"><div id="prob1" class="prob-fill"></div></div>
    <span id="prob1_text">25%</span>
  </div>

  <div class="prob-row">
    <span>🥉 中位</span>
    <div class="prob-bar"><div id="prob2" class="prob-fill"></div></div>
    <span id="prob2_text">25%</span>
  </div>

  <div class="prob-row">
    <span>📉 下位</span>
    <div class="prob-bar"><div id="prob3" class="prob-fill"></div></div>
    <span id="prob3_text">25%</span>
  </div>
</div>

<div class="panel log" id="log"></div>

</div>

<div class="panel log" id="log"></div>

<script src="script.js" defer></script>
</body>
</html>
