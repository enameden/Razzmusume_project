<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>レース抽選ツール</title>
<style>
body { font-family:sans-serif; background:#111; color:#eee; padding:20px; }
input, select, button { margin:5px; padding:5px; }
.box { margin-bottom:15px; }
.log { background:#222; padding:10px; height:220px; overflow:auto; }
</style>
</head>
<body>

<h1>レース抽選ツール</h1>

<div class="box">
  <label>レース：</label>
  <select id="raceSelect"></select>

  <label>人数：</label>
  <select id="players"></select>

  <label>やる気：</label>
  <select id="motivation">
    <option>普通</option>
    <option>好調</option>
    <option>絶好調</option>
  </select>
</div>

<div class="box">
<h3>プレイヤーステータス</h3>
<input id="スピード" placeholder="スピード">
<input id="スタミナ" placeholder="スタミナ">
<input id="パワー" placeholder="パワー">
<input id="根性" placeholder="根性">
<input id="賢さ" placeholder="賢さ">
</div>

<button onclick="run()">抽選開始</button>

<h2 id="result"></h2>
<div id="log" class="log"></div>

<script src="script.js"></script>
</body>
</html>
