<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>レースシミュレーター</title>

<style>
body {
  background:#0b0f1a;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
}

.container {
  max-width:500px;
  margin:auto;
}

.panel {
  background:#1a2233;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 0 10px #000;
}

h1 {
  color:#6cf;
}

.stat {
  text-align:left;
  margin:5px 0;
}

.bar {
  width:100%;
  height:12px;
  background:#333;
  border-radius:5px;
}

.fill {
  height:100%;
  background:linear-gradient(90deg,#4caf50,#8bc34a);
  border-radius:5px;
}

button {
  padding:10px 20px;
  background:#2a3a55;
  border:none;
  color:#fff;
  cursor:pointer;
  border-radius:5px;
}

button:hover {
  background:#3f5a88;
}

.log {
  height:200px;
  overflow:auto;
  text-align:left;
  background:#111;
  padding:10px;
  border-radius:5px;
}

.log-line {
  animation: fade 0.3s;
}

@keyframes fade {
  from {opacity:0;}
  to {opacity:1;}
}

.result {
  font-size:40px;
  color:gold;
  text-shadow:0 0 10px gold;
}

.prob-bar {
  height:10px;
  background:#444;
  margin:3px 0;
}

.prob-fill {
  height:100%;
  background:#6cf;
}
</style>
</head>

<body>

<div class="container">

<h1>レースシミュレーター</h1>

<div class="panel">
レース：
<select id="raceSelect"></select>

人数：
<select id="players"></select>

やる気：
<select id="motivation">
<option>普通</option>
<option>好調</option>
<option>絶好調</option>
</select>
</div>

<div class="panel">
<h3>ステータス</h3>

<div class="stat">スピード
<input id="スピード">
<div class="bar"><div id="bar_スピード" class="fill"></div></div>
</div>

<div class="stat">スタミナ
<input id="スタミナ">
<div class="bar"><div id="bar_スタミナ" class="fill"></div></div>
</div>

<div class="stat">パワー
<input id="パワー">
<div class="bar"><div id="bar_パワー" class="fill"></div></div>
</div>

<div class="stat">根性
<input id="根性">
<div class="bar"><div id="bar_根性" class="fill"></div></div>
</div>

<div class="stat">賢さ
<input id="賢さ">
<div class="bar"><div id="bar_賢さ" class="fill"></div></div>
</div>

</div>

<button onclick="run()">レース開始</button>

<div class="panel">
<h2 id="result" class="result"></h2>

</div>

<div class="panel log" id="log"></div>

</div>

<script src="script.js"></script>
</body>
</html>
