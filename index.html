<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Razz娘レースシミュレーター</title>

<style>
body {
  background:#0b0f1a;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
}

.container {
  max-width:1000px;
  margin:auto;
}


.panel {
  background:#1a2233;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 0 10px #000;
}

h1 {
  color:#6cf;
}

button {
  padding:10px 20px;
  background:#2a3a55;
  border:none;
  color:#fff;
  cursor:pointer;
  border-radius:5px;
}

button:hover {
  background:#3f5a88;
}
  
.log {
  height:200px;
  overflow:auto;
  text-align:left;
  background:#111;
  padding:10px;
  border-radius:5px;
}

.log-line {
  animation: fade 0.3s;
}

@keyframes fade {
  from {opacity:0;}
  to {opacity:1;}
}

.result {
  font-size:40px;
  color:gold;
  text-shadow:0 0 10px gold;
}
.stat{
  display:grid;
  grid-template-columns:120px 1fr;
  align-items:center;
  margin:6px 0;
}

.stat input{
  width:100px;
  justify-self:end;
  text-align:right;
}

#rouletteBox{
  margin:10px 0;
  padding:15px;
  background:#111;
  border:2px solid #6cf;
  border-radius:10px;
  box-shadow:0 0 10px #6cf;
}

#rouletteLabel{
  font-size:14px;
  color:#aaa;
}

#rouletteDisplay{
  font-size:28px;
  font-weight:bold;
  margin-top:5px;
  color:#fff;
  text-shadow:0 0 10px #6cf;
}

#bottomArea{
  display:flex;
  gap:16px;
  align-items:flex-start;
  width:100%;
}

#probBox{
  width:40%;
}

#log{
  width:60%;
  height:250px;
}

.prob-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:10px 0;
}

.prob-bar{
  flex:1;
  height:12px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
}

.prob-fill{
  height:100%;
  width:25%;
  background:linear-gradient(90deg,#6cf,#39f);
}

.result{
  font-size:42px;
  font-weight:bold;
  margin-top:20px;
}
  
</style>
</head>

<body>

<div class="container">

  <h1>
    Razz娘<br>
    レースシミュレーター
  </h1>

  <div class="panel">

    <div class="race-row">
      レース：<br>
      <select id="raceSelect"></select>
    </div>

    <div id="playersDisplay"></div>

    <div class="race-row">
      やる気：<br>
      <select id="motivation">
        <option>絶不調</option>
        <option>不調</option>
        <option selected>普通</option>
        <option>好調</option>
        <option>絶好調</option>
      </select>
    </div>

  </div>

  <div class="panel">

    <h3>ステータス</h3>

    <div class="stat">
      <label>スピード</label>
      <input type="number" id="スピード" value="100">
    </div>

    <div class="stat">
      <label>スタミナ</label>
      <input type="number" id="スタミナ" value="100">
    </div>

    <div class="stat">
      <label>パワー</label>
      <input type="number" id="パワー" value="100">
    </div>

    <div class="stat">
      <label>根性</label>
      <input type="number" id="根性" value="100">
    </div>

    <div class="stat">
      <label>賢さ</label>
      <input type="number" id="賢さ" value="100">
    </div>

  </div>

 <button id="raceBtn">入力完了</button>

<div id="rouletteBox">
  <div id="rouletteLabel">イベント抽選</div>
  <div id="rouletteDisplay">---</div>
</div>

  <!-- 結果 -->
<div id="result" class="result"></div>

  
<!-- 横並びエリア -->
<div id="bottomArea">

  <!-- 左：確率 -->
  <div id="probBox" class="panel">

    <div class="prob-row">
      <span>🥇 1位</span>
      <div class="prob-bar">
        <div id="prob0" class="prob-fill"></div>
      </div>
      <span id="prob0_text">25%</span>
    </div>

    <div class="prob-row">
      <span>🥈 上位</span>
      <div class="prob-bar">
        <div id="prob1" class="prob-fill"></div>
      </div>
      <span id="prob1_text">25%</span>
    </div>

    <div class="prob-row">
      <span>🥉 中位</span>
      <div class="prob-bar">
        <div id="prob2" class="prob-fill"></div>
      </div>
      <span id="prob2_text">25%</span>
    </div>

    <div class="prob-row">
      <span>📉 下位</span>
      <div class="prob-bar">
        <div id="prob3" class="prob-fill"></div>
      </div>
      <span id="prob3_text">25%</span>
    </div>

  </div>

  <!-- 右：ログ -->
  <div id="log" class="panel log"></div>

</div>

<script src="script.js" defer></script>

</body>
</html>
